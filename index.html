<!DOCTYPE html>
<html>
    <head>
        <title>Lab 2</title>

         <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>

    </head>

    <body>
        <div id="map" style="height: 500px"></div>

        <script type="text/javascript">

          var map = L.map('map', {
              center: [38.16, -96.96],
              zoom: 4
          });
		  
		

          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
               attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
               maxZoom: 4,
               minZoom: 4
            }).addTo(map);
			
			
			
					var homeIcon = L.icon({
    iconUrl: './home.png', // url that links to the icon image file, saved in the same folder as the current page 
    iconSize:     [32, 32], // size of the icon image in pixels
    iconAnchor:   [16, 32], // the top left corner of the icon will be aligned so that this point is at the marker's geographical location
    popupAnchor:  [0, -10] // point from which the popup should open, relative to the iconAnchor
});



				var marker1 = L.marker([34.04946,-118.24860], {icon: homeIcon, alt: 'Los Angeles'}).addTo(map);
				var marker2 = L.marker([42.04630,-87.69158], {icon: homeIcon, alt: 'Evanston'}).addTo(map);
				var marker3 = L.marker([49.25951,-123.11949], {icon: homeIcon, alt: 'Vancouver'}).addTo(map);
							
							
							
							
		
var pic1 = '<img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Los_Angeles_Skyline_telephoto_%282%29.jpg" alt="Los Angeles Skyline" width="250">';
var pic2 = '<img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Evanston%2C_IL_Aerial_View.jpg" alt="Evanston Aerial View" width="250">';
var pic3 = '<img src="https://upload.wikimedia.org/wikipedia/commons/3/33/Skyline_of_Vancouver%2C_Canada.jpg" alt="Vancouver Skyline" width="250">';


marker1.bindPopup('<p style="color:Gold; font-weight:bold"> First Home </p>' + pic1);
marker2.bindPopup('<p style="color:Purple; font-weight:bold"> Current Home </p>' + pic2);
marker3.bindPopup('<p style="color:Blue; font-weight:bold"> Canada Home </p>' + pic3);

					





        </script>
   </body>
</html>
